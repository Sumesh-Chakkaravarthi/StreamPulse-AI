name: Showcase Specification Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-specs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Validation Tools
        run: |
          pip install pydantic ruff

      - name: Validate Pydantic Interface Contracts
        run: |
          python3 -c "import interfaces; print('Interfaces successfully imported!')"

      - name: Validate OpenAPI 3.1 JSON Syntax
        run: |
          python3 -c "import json; schema = json.load(open('openapi.json')); print(f'Validated OpenAPI Spec: {len(schema[\"paths\"])} paths detected.')"

      - name: Lint Python Interfaces
        run: |
          ruff check interfaces/
          ruff format --check interfaces/

